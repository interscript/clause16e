name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run pytest
        run: python -m pytest tests -v

  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: CLI smoke (validate the shipped example configs)
        env:
          CLAUSE16E_CORPUS_DIR: /tmp/unused
          CLAUSE16E_WORDNET_PATH: /tmp/unused
          CLAUSE16E_MODEL_PATH: /tmp/unused
          CLAUSE16E_REFERENCE_MODEL_PATH: /tmp/unused
          CLAUSE16E_DEVICE: cpu
        run: |
          for c in configs/*.json; do clause16e validate --config "$c"; done
