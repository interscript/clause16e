[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clause16e"
version = "0.1.0"
description = "License-cleanliness gate: reference-calibrated membership inference on a matched split, plus extraction / verbatim / vocabulary leakage probes"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }

[project.optional-dependencies]
hf = ["transformers>=4.40", "torch>=2.1"]
test = ["pytest>=7"]

[project.scripts]
clause16e = "clause16e.cli:main"

[tool.setuptools.packages.find]
include = ["clause16e*"]
